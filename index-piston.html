<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>C Compiler - Piston API</title>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        max-width: 800px;
        margin: 2rem auto;
        padding: 0 1rem;
        background: #1a1a2e;
        color: #eee;
      }
      h1 { color: #00d9ff; }
      #status { color: #ffd93d; }
      pre {
        background: #0f0f1a;
        padding: 1rem;
        border-radius: 8px;
        overflow-x: auto;
      }
      code { color: #00ff88; }
      textarea {
        width: 100%;
        height: 200px;
        background: #0f0f1a;
        color: #00ff88;
        border: 1px solid #333;
        border-radius: 8px;
        padding: 1rem;
        font-family: monospace;
        font-size: 14px;
      }
      button {
        background: #00d9ff;
        color: #1a1a2e;
        border: none;
        padding: 0.75rem 1.5rem;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        margin-top: 1rem;
      }
      button:hover { background: #00b8d9; }
      button:disabled { background: #666; cursor: not-allowed; }
    </style>
  </head>
  <body>
    <h1>C Compiler (Piston API)</h1>
    
    <h3>Source Code:</h3>
    <textarea id="source">#include &lt;stdio.h&gt;

int main() {
    printf("Hello World from Piston!\n");
    
    for (int i = 1; i <= 5; i++) {
        printf("Count: %d\n", i);
    }
    
    return 0;
}</textarea>
    
    <button id="run" onclick="runCode()">▶ Run Code</button>
    
    <h3 id="status"></h3>
    <pre><code id="stdout"></code></pre>

    <script>
      async function runCode() {
        const status = document.getElementById("status");
        const stdout = document.getElementById("stdout");
        const runBtn = document.getElementById("run");
        const source = document.getElementById("source").value;

        runBtn.disabled = true;
        status.textContent = "Compiling and running...";
        stdout.textContent = "";

        try {
          const response = await fetch("https://emkc.org/api/v2/piston/execute", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              language: "c",
              version: "10.2.0",
              files: [{ name: "main.c", content: source }]
            })
          });

          const result = await response.json();

          if (result.run) {
            const output = result.run.stdout || "";
            const stderr = result.run.stderr || "";
            const exitCode = result.run.code;

            if (exitCode === 0) {
              status.textContent = "✓ Success (exit code: 0)";
              stdout.textContent = output || "(no output)";
            } else {
              status.textContent = `✗ Error (exit code: ${exitCode})`;
              stdout.textContent = stderr || output || "(no output)";
            }
          } else if (result.message) {
            status.textContent = "✗ API Error";
            stdout.textContent = result.message;
          }
        } catch (err) {
          status.textContent = "✗ Error: " + err.message;
          console.error(err);
        } finally {
          runBtn.disabled = false;
        }
      }
    </script>
  </body>
</html>
