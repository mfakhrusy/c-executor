<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>C Playground</title>
    <style>
      * { box-sizing: border-box; }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        max-width: 900px;
        margin: 0 auto;
        padding: 1rem;
        background: #1a1a2e;
        color: #eee;
      }
      h1 { 
        color: #00d9ff; 
        margin-bottom: 0.5rem;
      }
      .subtitle {
        color: #888;
        margin-bottom: 1.5rem;
      }
      .editor-container {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      textarea {
        width: 100%;
        height: 300px;
        background: #0f0f1a;
        color: #00ff88;
        border: 1px solid #333;
        border-radius: 8px;
        padding: 1rem;
        font-family: 'Consolas', 'Monaco', monospace;
        font-size: 14px;
        line-height: 1.5;
        resize: vertical;
      }
      textarea:focus {
        outline: none;
        border-color: #00d9ff;
      }
      .controls {
        display: flex;
        gap: 1rem;
        align-items: center;
      }
      button {
        background: #00d9ff;
        color: #1a1a2e;
        border: none;
        padding: 0.75rem 1.5rem;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        font-size: 14px;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      button:hover { background: #00b8d9; }
      button:disabled { 
        background: #444; 
        cursor: not-allowed; 
        color: #888;
      }
      .status {
        color: #ffd93d;
        font-size: 14px;
      }
      .status.success { color: #00ff88; }
      .status.error { color: #ff6b6b; }
      .output-container {
        background: #0f0f1a;
        border: 1px solid #333;
        border-radius: 8px;
        overflow: hidden;
      }
      .output-header {
        background: #252540;
        padding: 0.5rem 1rem;
        font-size: 12px;
        color: #888;
        border-bottom: 1px solid #333;
      }
      .output {
        padding: 1rem;
        font-family: 'Consolas', 'Monaco', monospace;
        font-size: 14px;
        white-space: pre-wrap;
        word-break: break-all;
        min-height: 100px;
        max-height: 300px;
        overflow-y: auto;
      }
      .output.stdout { color: #eee; }
      .output.stderr { color: #ff6b6b; }
    </style>
  </head>
  <body>
    <h1>C Playground</h1>
    <p class="subtitle">Write and run C code in your browser</p>

    <div class="editor-container">
      <textarea id="code">#include &lt;stdio.h&gt;

int main() {
    printf("Hello, World!\n");
    
    // Try some math
    int sum = 0;
    for (int i = 1; i <= 10; i++) {
        sum += i;
    }
    printf("Sum of 1-10: %d\n", sum);
    
    return 0;
}</textarea>

      <div class="controls">
        <button id="run" onclick="runCode()">
          <span>▶</span> Run Code
        </button>
        <span id="status" class="status"></span>
      </div>

      <div class="output-container">
        <div class="output-header">Output</div>
        <pre id="output" class="output stdout"></pre>
      </div>
    </div>

    <script>
      // API endpoint - auto-detect local vs production
      const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
        ? 'http://127.0.0.1:3001/execute'  // Local development
        : '/api/execute';                   // Production (via Caddy)

      async function runCode() {
        const code = document.getElementById('code').value;
        const status = document.getElementById('status');
        const output = document.getElementById('output');
        const runBtn = document.getElementById('run');

        runBtn.disabled = true;
        status.className = 'status';
        status.textContent = 'Compiling...';
        output.textContent = '';
        output.className = 'output stdout';

        try {
          const response = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code })
          });

          const result = await response.json();

          if (result.error) {
            status.className = 'status error';
            status.textContent = '✗ Error';
            output.className = 'output stderr';
            output.textContent = result.error;
          } else if (result.success) {
            status.className = 'status success';
            status.textContent = `✓ Success (exit code: ${result.exit_code})`;
            output.textContent = result.stdout || '(no output)';
          } else {
            status.className = 'status error';
            status.textContent = `✗ ${result.stage === 'compile' ? 'Compilation' : 'Runtime'} Error`;
            output.className = 'output stderr';
            output.textContent = result.stderr || result.stdout || '(no output)';
          }
        } catch (err) {
          status.className = 'status error';
          status.textContent = '✗ Connection Error';
          output.className = 'output stderr';
          output.textContent = err.message;
        } finally {
          runBtn.disabled = false;
        }
      }

      // Ctrl+Enter to run
      document.getElementById('code').addEventListener('keydown', (e) => {
        if (e.ctrlKey && e.key === 'Enter') {
          e.preventDefault();
          runCode();
        }
      });
    </script>
  </body>
</html>
