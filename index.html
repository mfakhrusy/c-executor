<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>C Compiler (Godbolt API)</title>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        max-width: 900px;
        margin: 2rem auto;
        padding: 0 1rem;
        background: #1a1a2e;
        color: #eee;
      }
      h1 { color: #00d9ff; }
      #status { color: #ffd93d; }
      .success { color: #00ff88 !important; }
      .error { color: #ff6b6b !important; }
      pre {
        background: #0f0f1a;
        padding: 1rem;
        border-radius: 8px;
        overflow-x: auto;
        white-space: pre-wrap;
      }
      textarea {
        width: 100%;
        min-height: 200px;
        background: #0f0f1a;
        color: #00ff88;
        border: 1px solid #333;
        border-radius: 8px;
        padding: 1rem;
        font-family: monospace;
        font-size: 14px;
        resize: vertical;
      }
      button {
        background: #00d9ff;
        color: #1a1a2e;
        border: none;
        padding: 0.75rem 1.5rem;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 1rem;
      }
      button:hover { background: #00b8d4; }
      button:disabled { background: #555; cursor: not-allowed; }
      .output-section { margin-top: 1.5rem; }
      .tabs {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 0.5rem;
      }
      .tab {
        padding: 0.5rem 1rem;
        background: #333;
        border: none;
        color: #eee;
        cursor: pointer;
        border-radius: 4px 4px 0 0;
      }
      .tab.active { background: #0f0f1a; }
      #asm-output, #execution-output { color: #ccc; }
    </style>
  </head>
  <body>
    <h1>🔧 C Compiler (Godbolt API)</h1>
    <p>Compile C code in the browser using <a href="https://godbolt.org" style="color:#00d9ff">Compiler Explorer</a> API</p>
    
    <h3>Source Code:</h3>
    <textarea id="source">#include &lt;stdio.h&gt;

int main() {
    printf("Hello World from Godbolt!\n");
    
    int sum = 0;
    for (int i = 1; i <= 10; i++) {
        sum += i;
    }
    printf("Sum of 1-10: %d\n", sum);
    
    return 0;
}</textarea>

    <button id="compile-btn" onclick="compile()">▶ Compile & Run</button>
    <button onclick="compileOnly()" style="background:#555;color:#eee">Assembly Only</button>
    
    <h2 id="status"></h2>

    <div class="output-section">
      <div class="tabs">
        <button class="tab active" onclick="showTab('execution')">Execution Output</button>
        <button class="tab" onclick="showTab('asm')">Assembly</button>
      </div>
      <pre id="execution-output" style="display:block"></pre>
      <pre id="asm-output" style="display:none"></pre>
    </div>

    <script>
      const GODBOLT_API = 'https://godbolt.org/api';
      const COMPILER = 'cclang1810'; // Clang 18.1.0

      function showTab(tab) {
        document.querySelectorAll('.tab').forEach((t, i) => {
          t.classList.toggle('active', (tab === 'execution' && i === 0) || (tab === 'asm' && i === 1));
        });
        document.getElementById('execution-output').style.display = tab === 'execution' ? 'block' : 'none';
        document.getElementById('asm-output').style.display = tab === 'asm' ? 'block' : 'none';
      }

      async function compile() {
        const status = document.getElementById('status');
        const execOutput = document.getElementById('execution-output');
        const asmOutput = document.getElementById('asm-output');
        const btn = document.getElementById('compile-btn');
        const source = document.getElementById('source').value;

        btn.disabled = true;
        status.textContent = 'Compiling...';
        status.className = '';
        execOutput.textContent = '';
        asmOutput.textContent = '';

        try {
          const response = await fetch(`${GODBOLT_API}/compiler/${COMPILER}/compile`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Accept': 'application/json'
            },
            body: JSON.stringify({
              source: source,
              options: {
                userArguments: '-O2 -Wall',
                filters: {
                  binary: false,
                  execute: true,
                  demangle: true,
                  labels: true,
                  directives: true,
                  commentOnly: true,
                  trim: true,
                  intel: true
                },
                compilerOptions: {
                  executorRequest: true
                }
              }
            })
          });

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
          }

          const result = await response.json();
          
          // Display assembly
          const asmLines = result.asm?.map(a => a.text).join('\n') || '';
          asmOutput.textContent = asmLines || '(No assembly output)';

          // Check for compilation errors
          if (result.code !== 0 && !result.execResult) {
            const stderr = result.stderr?.map(s => s.text).join('\n') || 'Compilation failed';
            status.textContent = '✗ Compilation Error';
            status.className = 'error';
            execOutput.textContent = stderr;
            return;
          }

          // Display execution output
          if (result.execResult) {
            const stdout = result.execResult.stdout?.map(s => s.text).join('\n') || '';
            const stderr = result.execResult.stderr?.map(s => s.text).join('\n') || '';
            const exitCode = result.execResult.code;
            
            execOutput.textContent = stdout || '(No output)';
            if (stderr) {
              execOutput.textContent += '\n\n--- stderr ---\n' + stderr;
            }
            execOutput.textContent += `\n\n[Exit code: ${exitCode}]`;
            
            status.textContent = exitCode === 0 ? '✓ Success!' : `✗ Exit code: ${exitCode}`;
            status.className = exitCode === 0 ? 'success' : 'error';
          } else {
            status.textContent = '✓ Compiled (no execution)';
            status.className = 'success';
            execOutput.textContent = '(Execution not available for this code)';
          }

        } catch (err) {
          status.textContent = '✗ Error: ' + err.message;
          status.className = 'error';
          execOutput.textContent = err.stack || err.message;
        } finally {
          btn.disabled = false;
        }
      }

      async function compileOnly() {
        const status = document.getElementById('status');
        const asmOutput = document.getElementById('asm-output');
        const source = document.getElementById('source').value;

        status.textContent = 'Compiling...';
        status.className = '';
        showTab('asm');

        try {
          const response = await fetch(`${GODBOLT_API}/compiler/${COMPILER}/compile`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Accept': 'application/json'
            },
            body: JSON.stringify({
              source: source,
              options: {
                userArguments: '-O2',
                filters: {
                  binary: false,
                  execute: false,
                  demangle: true,
                  labels: true,
                  directives: true,
                  commentOnly: true,
                  trim: true,
                  intel: true
                }
              }
            })
          });

          const result = await response.json();
          const asmLines = result.asm?.map(a => a.text).join('\n') || '';
          asmOutput.textContent = asmLines || '(No assembly output)';

          if (result.code !== 0) {
            const stderr = result.stderr?.map(s => s.text).join('\n') || '';
            status.textContent = '✗ Compilation Error';
            status.className = 'error';
            asmOutput.textContent = stderr + '\n\n' + asmLines;
          } else {
            status.textContent = '✓ Compiled!';
            status.className = 'success';
          }
        } catch (err) {
          status.textContent = '✗ Error: ' + err.message;
          status.className = 'error';
        }
      }
    </script>
  </body>
</html>
